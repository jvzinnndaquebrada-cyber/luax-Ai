<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuaX Studio - IA</title>
    <style>
        :root {
            --bg-dark: #111216;
            --sidebar-bg: #1a1c23;
            --chat-bg: #222531;
            --accent-color: #007acc;
            --text-color: #ffffff;
            --text-muted: #8b949e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            background-color: var(--bg-dark);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
        }

        /* BARRA LATERAL */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2d3139;
            padding: 10px;
        }

        .btn-new-chat {
            background: transparent;
            border: 1px solid #444c56;
            color: var(--text-color);
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            transition: background 0.2s;
            margin-bottom: 15px;
        }

        .btn-new-chat:hover:not(:disabled) { background: #2d3139; }
        .btn-new-chat:disabled { opacity: 0.5; cursor: not-allowed; }

        .chat-list-container { flex: 1; overflow-y: auto; }

        .chat-item {
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 5px;
            transition: background 0.2s;
        }

        .chat-item:hover, .chat-item.active { background: #2d3139; }

        /* Bloqueios visuais se deslogado */
        .sidebar.blocked .chat-list-container,
        .sidebar.blocked .btn-new-chat {
            display: none !important;
        }

        .blocked-message {
            display: none;
            color: #ff6b6b;
            font-size: 13px;
            text-align: center;
            padding: 20px 10px;
            border: 1px dashed #444c56;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .sidebar.blocked .blocked-message { display: block; }

        .user-section {
            border-top: 1px solid #2d3139;
            padding-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-login {
            background: #de4032;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* POPUP SIMULADO DO GOOGLE */
        .google-popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; display: none;
        }

        .google-box {
            background: white; color: #333;
            width: 380px; padding: 30px; border-radius: 8px;
            text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .google-box h2 { font-size: 20px; margin-bottom: 5px; color: #202124; }
        .google-box p { font-size: 14px; color: #5f6368; margin-bottom: 20px; }
        
        .google-input {
            width: 100%; padding: 12px; margin-bottom: 15px;
            border: 1px solid #dadce0; border-radius: 4px; font-size: 15px;
        }

        .google-btn-submit {
            background: #1a73e8; color: white; border: none;
            width: 100%; padding: 12px; border-radius: 4px;
            font-weight: bold; cursor: pointer;
        }

        /* ÁREA DO CHAT */
        .chat-area { flex: 1; display: flex; flex-direction: column; height: 100%; }
        .chat-header {
            padding: 15px; border-bottom: 1px solid #2d3139;
            font-size: 16px; font-weight: bold; display: flex;
            align-items: center; justify-content: space-between;
        }

        .messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
        .message { max-width: 80%; padding: 12px 16px; border-radius: 8px; font-size: 15px; line-height: 1.5; }
        .message.user { background-color: var(--accent-color); align-self: flex-end; }
        .message.ai { background-color: var(--chat-bg); align-self: flex-start; border: 1px solid #2d3139; }

        .input-container { padding: 20px; display: flex; gap: 10px; border-top: 1px solid #2d3139; }
        input[type="text"] {
            flex: 1; background-color: var(--chat-bg); border: 1px solid #444c56;
            border-radius: 6px; padding: 12px; color: white; outline: none;
        }
        input[type="text"]:focus { border-color: var(--accent-color); }
        .btn-send { background-color: var(--accent-color); color: white; border: none; padding: 0 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="sidebar blocked" id="sidebar">
        <button class="btn-new-chat" id="newChatBtn" onclick="createNewChat()">+ Novo Chat</button>
        
        <div class="blocked-message" id="blockedNotice">
            🔒 Biblioteca e Configurações ocultas. Faça login para continuar.
        </div>

        <div class="chat-list-container" id="chatList"></div>

        <div class="user-section">
            <span id="userInfo" style="font-size: 13px; color: var(--text-muted);">Desconectado</span>
            <button class="btn-login" id="loginBtn" onclick="openGooglePopup()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12.24 10.285V13.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 4.105 1.025 5.047 1.926l2.427-2.334C17.955 2.192 15.34 1 12.24 1c-6.075 0-11 4.925-11 11s4.925 11 11 11c6.34 0 10.556-4.43 10.556-10.73 0-.726-.075-1.282-.165-1.695H12.24z"/></svg>
                Fazer login com o Google
            </button>
        </div>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <span id="currentChatTitle">Painel LuaX</span>
            <span id="statusIndicator" style="font-size: 12px; color: #ff6b6b;">Acesso Restrito</span>
        </div>
        
        <div class="messages-container" id="messagesBox">
            <div class="message ai" id="welcomeMsg">Por motivos de segurança contra invasões, faça login com a sua conta Google para liberar o console e carregar seus scripts.</div>
        </div>

        <div class="input-container">
            <input type="text" id="userInput" placeholder="Bloqueado. Faça login na barra lateral..." onkeypress="handleKeyPress(event)">
            <button class="btn-send" onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <div class="google-popup-overlay" id="googlePopup">
        <div class="google-box">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" width="90" style="margin-bottom:15px;" alt="Google">
            <h2>Fazer login</h2>
            <p>Use sua Conta do Google para entrar no LuaX Studio</p>
            <input type="email" class="google-input" id="googleEmail" placeholder="E-mail ou telefone" required>
            <button class="google-btn-submit" onclick="submitGoogleLogin()">Avançar</button>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURAÇÃO DE SEGURANÇA: COLOQUE SEU EMAIL AQUI!
        // ==========================================
        const EMAIL_DO_DONO = "jvzinnndaquebrada@gmail.com"; 
        const SERVER_URL = 'http://127.0.0.1:5000/chat';

        let chats = JSON.parse(localStorage.getItem('luax_chats')) || {};
        let currentChatId = localStorage.getItem('luax_current_chat') || null;
        let loginStatus = localStorage.getItem('luax_role') || null; // 'dono', 'membro' ou null

        window.onload = function() {
            if (loginStatus) {
                unlockInterface(loginStatus);
            } else {
                document.getElementById('userInput').disabled = true;
            }
        };

        function openGooglePopup() {
            document.getElementById('googlePopup').style.display = 'flex';
        }

        function submitGoogleLogin() {
            const emailInput = document.getElementById('googleEmail').value.trim().toLowerCase();
            if (!emailInput || !emailInput.includes('@')) {
                alert("Por favor, insira um e-mail válido da sua conta Google.");
                return;
            }

            document.getElementById('googlePopup').style.display = 'none';

            // VERIFICAÇÃO DO EMAIL
            if (emailInput === EMAIL_DO_DONO.toLowerCase()) {
                localStorage.setItem('luax_role', 'dono');
                loginStatus = 'dono';
                alert("Acesso de Administrador Confirmado! 👑");
            } else {
                localStorage.setItem('luax_role', 'membro');
                loginStatus = 'membro';
                alert("Logado com sucesso como Visitante comercial.");
            }

            unlockInterface(loginStatus);

            if (Object.keys(chats).length === 0) {
                createNewChat();
            } else {
                loadChat(currentChatId || Object.keys(chats)[0]);
            }
        }

        function unlockInterface(role) {
            const sidebar = document.getElementById('sidebar');
            
            if (role === 'dono') {
                sidebar.classList.remove('blocked'); // Dono vê tudo (Library, Configs)
                document.getElementById('userInfo').innerText = "Dono do Sistema 👑";
                document.getElementById('statusIndicator').innerText = "Modo Desenvolvedor (Total)";
                document.getElementById('statusIndicator').style.color = "gold";
            } else {
                // Visitante Comum fica com travas eternas na barra lateral
                sidebar.classList.add('blocked'); 
                document.getElementById('userInfo').innerText = "Conta: Membro Comum ✔️";
                document.getElementById('statusIndicator').innerText = "Modo Visitante (Limitado)";
                document.getElementById('statusIndicator').style.color = "#a3b1cc";
                document.getElementById('blockedNotice').innerText = "🔒 Erro: Apenas o Dono do sistema possui permissão para abrir a Library ou Configurações.";
            }

            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('userInput').disabled = false;
            document.getElementById('userInput').placeholder = "Envie um comando ou tire dúvidas de Lua do Roblox...";
            document.getElementById('welcomeMsg').innerText = `Conexão estabelecida com sucesso. Como posso ajudar o seu projeto hoje?`;
            
            renderChatList();
        }

        function renderChatList() {
            if (loginStatus !== 'dono') return; // Se não for dono, a lista nem é gerada no HTML
            const list = document.getElementById('chatList');
            list.innerHTML = '';
            
            Object.keys(chats).reverse().forEach(id => {
                const item = document.createElement('div');
                item.classList.add('chat-item');
                if (id === currentChatId) item.classList.add('active');
                item.innerText = chats[id].title || "Chat sem título";
                item.onclick = () => loadChat(id);
                list.appendChild(item);
            });
        }

        function createNewChat() {
            if (loginStatus !== 'dono') return;
            const id = 'chat_' + Date.now();
            chats[id] = { title: 'Novo Chat', messages: [] };
            currentChatId = id;
            saveToLocalStorage();
            renderChatList();
            loadChat(id);
        }

        function loadChat(id) {
            if (loginStatus !== 'dono') return;
            currentChatId = id;
            localStorage.setItem('luax_current_chat', id);
            document.getElementById('currentChatTitle').innerText = chats[id].title;
            
            const box = document.getElementById('messagesBox');
            box.innerHTML = '';
            chats[id].messages.forEach(msg => appendMessageToDOM(msg.text, msg.sender));
            box.scrollTop = box.scrollHeight;
        }

        function appendMessageToDOM(text, sender) {
            const box = document.getElementById('messagesBox');
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.innerText = text;
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }

        function saveToLocalStorage() {
            if (loginStatus === 'dono') {
                localStorage.setItem('luax_chats', JSON.stringify(chats));
            }
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            appendMessageToDOM(text, 'user');

            if (loginStatus === 'dono') {
                chats[currentChatId].messages.push({ text: text, sender: 'user' });
                if (chats[currentChatId].title === 'Novo Chat') {
                    chats[currentChatId].title = text.substring(0, 20) + (text.length > 20 ? '...' : '');
                }
                saveToLocalStorage();
                renderChatList();
            }

            appendMessageToDOM("Pensando...", 'ai');
            const box = document.getElementById('messagesBox');
            const lastMessageDiv = box.lastChild;

            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                if (!response.ok) throw new Error();
                const data = await response.json();
                
                lastMessageDiv.innerText = data.response;
                
                if (loginStatus === 'dono') {
                    chats[currentChatId].messages.push({ text: data.response, sender: 'ai' });
                    saveToLocalStorage();
                }
            } catch (error) {
                lastMessageDiv.innerText = "Erro: Ligue o seu servidor.py local no computador!";
                lastMessageDiv.style.color = "#ff6b6b";
            }
        }
    </script>
</body>
</html>
