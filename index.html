<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuaX Studio - IA</title>
    <style>
        :root {
            --bg-dark: #111216;
            --sidebar-bg: #1a1c23;
            --chat-bg: #222531;
            --accent-color: #007acc;
            --text-color: #ffffff;
            --text-muted: #8b949e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            background-color: var(--bg-dark);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
        }

        /* BARRA LATERAL */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2d3139;
            padding: 10px;
            position: relative;
        }

        .btn-new-chat {
            background: transparent;
            border: 1px solid #444c56;
            color: var(--text-color);
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            transition: background 0.2s;
            margin-bottom: 15px;
        }

        .btn-new-chat:hover:not(:disabled) {
            background: #2d3139;
        }

        .btn-new-chat:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chat-list-container {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 5px;
            transition: background 0.2s;
        }

        .chat-item:hover, .chat-item.active {
            background: #2d3139;
        }

        /* Bloqueio da Library/Configurações */
        .sidebar.blocked .chat-list-container,
        .sidebar.blocked .btn-new-chat {
            display: none !important; /* Esconde completamente os chats antigos e novo chat se deslogado */
        }

        .blocked-message {
            display: none;
            color: #ff6b6b;
            font-size: 13px;
            text-align: center;
            padding: 20px 10px;
            border: 1px dashed #444c56;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .sidebar.blocked .blocked-message {
            display: block;
        }

        .user-section {
            border-top: 1px solid #2d3139;
            padding-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-login {
            background: #de4032; /* Cor estilo Google */
            border: none;
            color: white;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .btn-login:hover {
            opacity: 0.9;
        }

        /* ÁREA DO CHAT */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-header {
            padding: 15px;
            border-bottom: 1px solid #2d3139;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.5;
        }

        .message.user {
            background-color: var(--accent-color);
            align-self: flex-end;
        }

        .message.ai {
            background-color: var(--chat-bg);
            align-self: flex-start;
            border: 1px solid #2d3139;
        }

        .input-container {
            padding: 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #2d3139;
        }

        input[type="text"] {
            flex: 1;
            background-color: var(--chat-bg);
            border: 1px solid #444c56;
            border-radius: 6px;
            padding: 12px;
            color: white;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .btn-send {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-send:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="sidebar blocked" id="sidebar">
        <button class="btn-new-chat" id="newChatBtn" onclick="createNewChat()">+ Novo Chat</button>
        
        <div class="blocked-message" id="blockedNotice">
            🔒 Library e Configurações bloqueadas. Faça login com o Google para ver chats antigos.
        </div>

        <div class="chat-list-container" id="chatList">
            </div>

        <div class="user-section">
            <span id="userInfo" style="font-size: 13px; color: var(--text-muted);">Desconectado</span>
            <button class="btn-login" id="loginBtn" onclick="simulateGoogleLogin()">🔴 Criar conta / Entrar com Google</button>
        </div>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <span id="currentChatTitle">Painel LuaX</span>
            <span id="statusIndicator" style="font-size: 12px; color: gold;">Modo Protegido</span>
        </div>
        
        <div class="messages-container" id="messagesBox">
            <div class="message ai">Bem-vindo ao LuaX Studio. Por segurança, faça login com sua conta Google na barra lateral para salvar seu progresso e liberar o histórico de scripts.</div>
        </div>

        <div class="input-container">
            <input type="text" id="userInput" placeholder="Faça login para liberar todos os recursos..." onkeypress="handleKeyPress(event)">
            <button class="btn-send" onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        const SERVER_URL = 'http://127.0.0.1:5000/chat';

        let chats = JSON.parse(localStorage.getItem('luax_chats')) || {};
        let currentChatId = localStorage.getItem('luax_current_chat') || null;
        let isLoggedIn = localStorage.getItem('luax_logged_in') === 'true';

        window.onload = function() {
            if (isLoggedIn) {
                unlockInterface();
            } else {
                document.getElementById('userInput').disabled = true;
                document.getElementById('userInput').placeholder = "Acesso bloqueado. Faça login primeiro.";
            }
        };

        function simulateGoogleLogin() {
            // Ativa o estado de logado
            localStorage.setItem('luax_logged_in', 'true');
            isLoggedIn = true;
            unlockInterface();
            
            // Cria um chat inicial se a pessoa nunca tiver usado
            if (Object.keys(chats).length === 0) {
                createNewChat();
            } else {
                if (currentChatId && chats[currentChatId]) {
                    loadChat(currentChatId);
                } else {
                    const firstId = Object.keys(chats)[0];
                    loadChat(firstId);
                }
            }
        }

        function unlockInterface() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.remove('blocked'); // Remove as travas visuais e mostra a library
            
            document.getElementById('userInfo').innerText = "Conta Google: Conectado v3 👑";
            document.getElementById('loginBtn').style.display = 'none';
            
            document.getElementById('userInput').disabled = false;
            document.getElementById('userInput').placeholder = "Envie um comando ou tire dúvidas de Lua do Roblox...";
            
            renderChatList();
        }

        function renderChatList() {
            if (!isLoggedIn) return;
            const list = document.getElementById('chatList');
            list.innerHTML = '';
            
            Object.keys(chats).reverse().forEach(id => {
                const item = document.createElement('div');
                item.classList.add('chat-item');
                if (id === currentChatId) item.classList.add('active');
                
                item.innerText = chats[id].title || "Chat sem título";
                item.onclick = () => loadChat(id);
                list.appendChild(item);
            });
        }

        function createNewChat() {
            if (!isLoggedIn) return;
            const id = 'chat_' + Date.now();
            chats[id] = {
                title: 'Novo Chat',
                messages: []
            };
            currentChatId = id;
            saveToLocalStorage();
            renderChatList();
            loadChat(id);
        }

        function loadChat(id) {
            if (!isLoggedIn) return;
            currentChatId = id;
            localStorage.setItem('luax_current_chat', id);
            
            document.getElementById('currentChatTitle').innerText = chats[id].title;
            
            const box = document.getElementById('messagesBox');
            box.innerHTML = '';
            
            chats[id].messages.forEach(msg => {
                appendMessageToDOM(msg.text, msg.sender);
            });
            
            renderChatList();
            box.scrollTop = box.scrollHeight;
        }

        function appendMessageToDOM(text, sender) {
            const box = document.getElementById('messagesBox');
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.innerText = text;
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }

        function saveToLocalStorage() {
            localStorage.setItem('luax_chats', JSON.stringify(chats));
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            if (!isLoggedIn) return;
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';

            appendMessageToDOM(text, 'user');
            chats[currentChatId].messages.push({ text: text, sender: 'user' });
            
            if (chats[currentChatId].title === 'Novo Chat') {
                chats[currentChatId].title = text.substring(0, 20) + (text.length > 20 ? '...' : '');
            }
            
            saveToLocalStorage();
            renderChatList();

            appendMessageToDOM("Pensando...", 'ai');
            const box = document.getElementById('messagesBox');
            const lastMessageDiv = box.lastChild;

            try {
                const response = await fetch(SERVER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) throw new Error();

                const data = await response.json();
                lastMessageDiv.innerText = data.response;
                chats[currentChatId].messages.push({ text: data.response, sender: 'ai' });
                saveToLocalStorage();

            } catch (error) {
                lastMessageDiv.innerText = "Erro: Verifique se o seu servidor.py está ativo no terminal preto do computador!";
                lastMessageDiv.style.color = "#ff6b6b";
            }
        }
    </script>
</body>
</html>
